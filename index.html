<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Z-Kit Discord UI</title>
    <link href="https://fonts.googleapis.com/css2?family=gg+sans:wght@400;500;600;700;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
    <style>
        /* --- DISCORD/Z-KIT DESIGN SYSTEM --- */
        :root {
            --bg-servers: #1e1f22;
            --bg-channels: #2b2d31;
            --bg-chat: #313338;
            --bg-chat-input: #383a40;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --accent-blue: #5865f2;
            --accent-green: #23a559;
            --white: #ffffff;
            --font-discord: 'gg sans', 'Inter', sans-serif;
        }

        /* --- CORE ARCHITECTURE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-discord);
            background-color: var(--bg-chat);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- SERVER STRIP (FAR LEFT) --- */
        .server-rail {
            width: 72px;
            background-color: var(--bg-servers);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            overflow-y: auto;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-chat);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .server-icon:hover, .server-icon.active {
            border-radius: 16px;
            background-color: var(--accent-blue);
        }

        .server-icon img { width: 28px; height: 28px; filter: brightness(1); }
        .server-separator { width: 32px; height: 2px; background: #35363c; margin: 4px 0; border-radius: 1px; }

        /* --- CHANNEL SIDEBAR (MIDDLE) --- */
        .sidebar {
            width: 240px;
            background-color: var(--bg-channels);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
            font-weight: 700;
            color: var(--white);
            font-size: 15px;
        }

        .channel-list { flex: 1; overflow-y: auto; padding: 12px 8px; }
        
        .category {
            padding: 18px 8px 4px 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .channel-item {
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
            transition: 0.1s;
        }

        .channel-item:hover { background-color: #35373c; color: var(--text-normal); }
        .channel-item.active { background-color: #3f4147; color: var(--white); }
        .channel-item span { margin-right: 6px; font-size: 20px; font-family: monospace; opacity: 0.6; }

        /* --- MAIN VIEWPORT (RIGHT) --- */
        .chat-container { flex: 1; display: flex; flex-direction: column; }
        
        .chat-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
            font-weight: 600;
            color: var(--white);
            gap: 8px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: none; /* Controlled by JS */
            flex-direction: column;
        }
        .chat-messages.active { display: flex; }

        /* MESSAGE STYLE */
        .message {
            padding: 2px 16px;
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }
        .message:hover { background-color: #2e3035; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-user { color: var(--white); font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .msg-user span { font-size: 12px; color: var(--text-muted); font-weight: 400; }
        .msg-text { color: var(--text-normal); font-size: 16px; margin-top: 4px; line-height: 1.3; }

        /* INPUT AREA */
        .input-wrapper { padding: 0 16px 24px 16px; }
        .input-box {
            background-color: var(--bg-chat-input);
            border-radius: 8px;
            padding: 11px 16px;
            display: flex;
            align-items: center;
        }
        .input-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-normal);
            width: 100%;
            font-size: 16px;
        }

        /* --- ARCADE & GRID (REMASTERED) --- */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 16px; }
        .game-card { background: var(--bg-channels); border-radius: 8px; overflow: hidden; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
        .game-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .game-card img { width: 100%; height: 160px; object-fit: cover; }
        .game-name { padding: 12px; color: var(--white); font-weight: 600; }

        /* --- SCALEDRONE GATE --- */
        #auth-gate {
            position: fixed; inset: 0; background: var(--bg-servers); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="auth-gate">
        <h2 style="color:white; margin-bottom:20px;">Welcome Back</h2>
        <input type="text" id="callsign" placeholder="Enter Callsign" style="padding:10px; border-radius:4px; border:none; width:250px;">
        <button onclick="login()" style="margin-top:15px; background:var(--accent-blue); color:white; border:none; padding:10px 40px; border-radius:4px; font-weight:600; cursor:pointer;">Login</button>
    </div>

    <div class="server-rail">
        <div class="server-icon active" onclick="nav('home')" style="background-image: url('https://cdn-icons-png.flaticon.com/512/3670/3670147.png');"></div>
        <div class="server-separator"></div>
        <div class="server-icon" onclick="window.open('https://youtube.com')" style="background-image: url('https://cdn-icons-png.flaticon.com/512/1384/1384060.png');"></div>
        <div class="server-icon" onclick="window.open('https://tiktok.com')" style="background-image: url('https://cdn-icons-png.flaticon.com/512/3046/3046121.png');"></div>
        <div class="server-icon" onclick="window.open('https://soundcloud.com')" style="background-image: url('https://cdn-icons-png.flaticon.com/512/145/145809.png');"></div>
        <div class="server-separator"></div>
        <div class="server-icon" style="background-color: var(--accent-green); color: white; font-weight: 700; font-size: 20px;">+</div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">ZK · Z-Kit 🛡️</div>
        <div class="channel-list">
            <div class="category">▼ Forums</div>
            <div class="channel-item" onclick="nav('home')"><span>#</span> suggestions</div>
            <div class="channel-item" onclick="nav('arcade')"><span>#</span> arcade-games</div>
            
            <div class="category">▼ Links</div>
            <div class="channel-item" onclick="window.open('https://discord.com')"><span>#</span> link-gen</div>
            <div class="channel-item active" onclick="nav('chat')"><span>#</span> community-links</div>
            
            <div class="category">▼ System</div>
            <div class="channel-item" onclick="nav('settings')"><span>#</span> settings</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header" id="header-title"># community-links</div>
        
        <div class="chat-messages active" id="chat-view">
            <div class="message">
                <div class="msg-avatar" style="background:#23a559"></div>
                <div class="msg-content">
                    <div class="msg-user">System BOT <span>Today at 10:45 AM</span></div>
                    <div class="msg-text">Welcome to the Z-Kit Secure Uplink. Type below to broadcast to all units.</div>
                </div>
            </div>
            <div id="dynamic-feed"></div>
        </div>

        <div class="chat-messages" id="arcade-view">
            <div class="game-grid">
                <div class="game-card" onclick="window.open('https://poki.com')"><img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400"><div class="game-name">Poki Central</div></div>
                <div class="game-card" onclick="window.open('https://1v1.lol')"><img src="https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=400"><div class="game-name">1v1 Tactical</div></div>
            </div>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <input type="text" id="msg-input" placeholder="Message #community-links" onkeydown="if(event.key==='Enter') send()">
            </div>
        </div>
    </div>

    <script>
        let drone, room, myName;

        function login() {
            myName = document.getElementById('callsign').value || "Commander";
            document.getElementById('auth-gate').style.display = 'none';
            drone = new ScaleDrone('yiS12sYPLP793Q0A', { data: { name: myName } });
            drone.on('open', error => {
                room = drone.subscribe('observable-nexus-bridge');
                room.on('data', (d, m) => { if(m) post(d, m.authData.name, m.id === drone.clientId); });
            });
        }

        function nav(id) {
            document.querySelectorAll('.chat-messages').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            
            if(id === 'chat') {
                document.getElementById('chat-view').classList.add('active');
                document.getElementById('header-title').innerText = '# community-links';
            } else if(id === 'arcade') {
                document.getElementById('arcade-view').classList.add('active');
                document.getElementById('header-title').innerText = '# arcade-games';
            }
        }

        function send() {
            const i = document.getElementById('msg-input');
            if(i.value.trim()) { drone.publish({room: 'observable-nexus-bridge', message: i.value}); i.value=""; }
        }

        function post(t, u, me) {
            const f = document.getElementById('dynamic-feed');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="msg-avatar" style="background:${me ? '#5865f2' : '#eb459e'}"></div>
                <div class="msg-content">
                    <div class="msg-user">${u} <span>Just now</span></div>
                    <div class="msg-text">${t}</div>
                </div>
            `;
            f.appendChild(div);
            document.getElementById('chat-view').scrollTop = document.getElementById('chat-view').scrollHeight;
        }

        window.onkeydown = (e) => { if(e.key === '~') window.location.href="https://google.com"; };
    </script>
</body>
</html>
