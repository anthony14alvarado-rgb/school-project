<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Z‑Kit</title>

<style>
/* ---------------------------------------------------
   GLOBAL THEME
--------------------------------------------------- */
:root {
    --bg: #0d0d0f;
    --card: #151518;
    --accent: #4f7dff;
    --text: #e6e6e6;
    --dim: #8a8a8a;
    --border: #1f1f22;
    --radius: 14px;
    --shadow: 0 0 25px rgba(0,0,0,0.35);
    --transition: 0.25s ease;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

/* ---------------------------------------------------
   SIDEBAR
--------------------------------------------------- */
#sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 78px;
    height: 100vh;
    background: #111114;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 25px;
    gap: 25px;
}

.side-btn {
    width: 52px;
    height: 52px;
    background: var(--card);
    border-radius: var(--radius);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: var(--transition);
}

.side-btn:hover {
    background: #1d1d21;
}

/* ---------------------------------------------------
   HERO SECTION
--------------------------------------------------- */
#hero {
    margin-left: 110px;
    padding: 80px 40px;
}

#hero h1 {
    font-size: 42px;
    font-weight: 700;
}

#hero p {
    margin-top: 10px;
    font-size: 18px;
    color: var(--dim);
}

/* ---------------------------------------------------
   APP GRID
--------------------------------------------------- */
#apps {
    margin-left: 110px;
    padding: 20px 40px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 25px;
}

.app-card {
    background: var(--card);
    padding: 25px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: var(--transition);
}

.app-card:hover {
    transform: translateY(-4px);
    background: #1b1b1f;
}

/* ---------------------------------------------------
   CHAT DRAWER
--------------------------------------------------- */
#chat-drawer {
    position: fixed;
    right: -350px;
    top: 0;
    width: 350px;
    height: 100vh;
    background: #111114;
    border-left: 1px solid var(--border);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
}

#chat-drawer.open {
    right: 0;
}

#cv {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

#msg {
    width: 100%;
    padding: 15px;
    border: none;
    outline: none;
    background: var(--card);
    color: var(--text);
}

/* ---------------------------------------------------
   SETTINGS OVERLAY
--------------------------------------------------- */
#settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    justify-content: center;
    align-items: center;
}

.settings-box {
    background: var(--card);
    padding: 35px;
    border-radius: var(--radius);
    width: 350px;
    box-shadow: var(--shadow);
}

/* ---------------------------------------------------
   MUSIC OVERLAY
--------------------------------------------------- */
#music-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    justify-content: center;
    align-items: center;
}

.music-box {
    background: var(--card);
    width: 380px;
    padding: 30px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

#music-results {
    background: #1a1a1d;
    margin-top: 10px;
    border-radius: var(--radius);
    display: none;
}

.music-result-item {
    display: flex;
    padding: 10px;
    cursor: pointer;
    transition: var(--transition);
}

.music-result-item:hover {
    background: #222226;
}

.music-result-item img {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    margin-right: 10px;
}

#music-lyrics {
    margin-top: 15px;
    padding: 10px;
    background: #1a1a1d;
    border-radius: var(--radius);
    display: none;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<!-- ---------------------------------------------------
     SIDEBAR
--------------------------------------------------- -->
<div id="sidebar">
    <div class="side-btn" onclick="toggleChat()">💬</div>
    <div class="side-btn" onclick="toggleMusic()">🎵</div>
    <div class="side-btn" onclick="toggleSettings()">⚙️</div>
</div>

<!-- ---------------------------------------------------
     HERO
--------------------------------------------------- -->
<section id="hero">
    <h1>Nexus Z‑Kit</h1>
    <p>Your personal command center — rebuilt, refined, and upgraded.</p>
</section>

<!-- ---------------------------------------------------
     APPS
--------------------------------------------------- -->
<section id="apps">
    <div class="app-card">Community Chat</div>
    <div class="app-card">Music Player</div>
    <div class="app-card">Settings</div>
    <div class="app-card">Games Hub</div>
</section>

<!-- ---------------------------------------------------
     CHAT DRAWER
--------------------------------------------------- -->
<div id="chat-drawer">
    <div id="cv"></div>
    <input id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
</div>

<!-- ---------------------------------------------------
     SETTINGS OVERLAY
--------------------------------------------------- -->
<div id="settings-overlay">
    <div class="settings-box">
        <h2>Settings</h2>
        <p style="color:var(--dim); margin-top:10px;">More settings coming soon.</p>
    </div>
</div>

<!-- ---------------------------------------------------
     MUSIC OVERLAY
--------------------------------------------------- -->
<div id="music-overlay">
    <div class="music-box">
        <h2>Music Player</h2>

        <input id="music-search" placeholder="Search songs..." 
               style="width:100%; padding:12px; margin-top:15px; background:#1a1a1d; border:none; border-radius:var(--radius); color:var(--text);"
               oninput="searchMusic()">

        <div id="music-results"></div>

        <img id="music-image" src="" style="width:100%; margin-top:20px; border-radius:var(--radius); display:none;">
        <h3 id="music-title" style="margin-top:10px;"></h3>
        <p id="music-artist" style="color:var(--dim);"></p>

        <audio id="music-player" controls style="width:100%; margin-top:15px;">
            <source id="music-source" src="">
        </audio>

        <button onclick="toggleLyrics()" style="margin-top:15px; width:100%; padding:12px; background:var(--accent); border:none; border-radius:var(--radius); color:white; cursor:pointer;">
            Toggle Lyrics
        </button>

        <div id="music-lyrics"></div>
    </div>
</div>

<!-- ---------------------------------------------------
     SCRIPT
--------------------------------------------------- -->
<script>
/* CHAT */
let drone, room;

function toggleChat() {
    document.getElementById('chat-drawer').classList.toggle('open');
}

function send() {
    const i = document.getElementById('msg');
    if (i.value.trim()) {
        const div = document.createElement('div');
        div.style.marginBottom = "15px";
        div.innerHTML = `<span style="color:var(--dim); font-size:11px;">You</span><br>${i.value}`;
        document.getElementById('cv').appendChild(div);
        i.value = "";
    }
}

/* SETTINGS */
function toggleSettings() {
    const s = document.getElementById('settings-overlay');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
}

/* MUSIC */
const songs = [
    {
        title: "Lucid Dreams",
        artist: "Juice WRLD",
        image: "lucid.jpg",
        file: "lucid.mp3",
        lyrics: "I still see your shadows in my room..."
    },
    {
        title: "Example Track",
        artist: "Nexus",
        image: "example.jpg",
        file: "example.mp3",
        lyrics: "This is an example song."
    }
];

let currentSong = null;
let lyricsVisible = false;

function toggleMusic() {
    const m = document.getElementById('music-overlay');
    m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
}

function searchMusic() {
    const q = document.getElementById('music-search').value.toLowerCase().trim();
    const box = document.getElementById('music-results');

    if (!q) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
    }

    const filtered = songs.filter(s =>
        s.title.toLowerCase().includes(q) ||
        s.artist.toLowerCase().includes(q)
    );

    if (!filtered.length) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
    }

    box.innerHTML = "";
    filtered.forEach(song => {
        const div = document.createElement('div');
        div.className = "music-result-item";
        div.onclick = () => selectSong(song);

        div.innerHTML = `
            <img src="${song.image}">
            <div>
                <div>${song.title}</div>
                <div style="color:var(--dim); font-size:13px;">${song.artist}</div>
            </div>
        `;

        box.appendChild(div);
    });

    box.style.display = "block";
}

function selectSong(song) {
    currentSong = song;

    document.getElementById('music-image').src = song.image;
    document.getElementById('music-image').style.display = "block";
    document.getElementById('music-title').textContent = song.title;
    document.getElementById('music-artist').textContent = song.artist;

    const player = document.getElementById('music-player');
    const source = document.getElementById('music-source');
    source.src = song.file;
    player.load();
    player.play().catch(()=>{});

    const lyricsBox = document.getElementById('music-lyrics');
    lyricsBox.style.display = "none";
    lyricsBox.textContent = song.lyrics || "No lyrics available.";

    document.getElementById('music-results').style.display = "none";
}

function toggleLyrics() {
    if (!currentSong) return;
    const box = document.getElementById('music-lyrics');
    lyricsVisible = !lyricsVisible;
    box.style.display = lyricsVisible ? "block" : "none";
}

/* PANIC KEY */
window.onkeydown = (e) => {
    if (e.key === '~') window.location.href = "https://google.com";
};
</script>

</body>
</html>
