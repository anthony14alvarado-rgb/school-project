<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --miku-glow: rgba(57, 197, 187, 0.7);
            --dark-glass: rgba(10, 20, 30, 0.75);
            --border-cyan: rgba(57, 197, 187, 0.5);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', sans-serif; user-select: none;
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: radial-gradient(circle at center, #1a3a4a 0%, #050a0f 100%);
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative;
        }

        /* Snowflake Ceiling System */
        #snow-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        .falling-snow {
            position: absolute; top: -50px;
            width: 30px; height: 30px;
            filter: drop-shadow(0 0 8px var(--miku-cyan));
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Top Navigation Pills */
        .top-nav {
            position: relative; z-index: 100;
            display: flex; justify-content: space-between; padding: 30px 50px;
        }

        .pill {
            background: var(--dark-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border-cyan); border-radius: 40px;
            padding: 12px 28px; color: white; font-weight: 800;
            letter-spacing: 1.5px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .pill:hover {
            border-color: white; box-shadow: 0 0 20px var(--miku-glow);
            transform: translateY(-2px);
        }

        .pill span { color: var(--miku-cyan); font-size: 1.2rem; }

        /* Center Content - Miku & Glow Text */
        .main-display {
            position: relative; z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex-grow: 1; margin-top: -40px;
        }

        .miku-char {
            height: 420px; width: auto;
            margin-bottom: -130px; /* Overlaps text */
            filter: drop-shadow(0 0 40px var(--miku-cyan));
            animation: mikuFloat 6s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes mikuFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(2deg); }
        }

        .glowing-title {
            font-size: 9rem; font-weight: 900; color: white;
            text-shadow: 0 0 20px var(--miku-cyan), 0 0 40px var(--miku-cyan), 0 0 80px var(--miku-cyan);
            letter-spacing: 12px; z-index: 2; position: relative;
        }

        /* Search Bar */
        .search-box {
            width: 600px; margin-top: 30px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px);
            border: 2px solid var(--border-cyan); border-radius: 60px;
            padding: 18px 35px; display: flex; align-items: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .search-box:focus-within {
            width: 650px; border-color: white;
            box-shadow: 0 0 30px var(--miku-glow);
        }

        .search-input {
            background: transparent; border: none; outline: none;
            color: white; font-size: 1.2rem; width: 100%;
            font-weight: 600; text-align: center;
        }

        .search-input::placeholder { color: rgba(255,255,255,0.5); }

        /* Bottom Dock */
        .dock-container {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: 30px; position: relative; z-index: 100;
        }

        .dock {
            background: var(--dark-glass); backdrop-filter: blur(25px);
            border: 1px solid var(--border-cyan); border-radius: 30px;
            display: flex; gap: 50px; padding: 20px 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .dock-item {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.3s;
        }

        .dock-item:hover { transform: translateY(-15px); }

        .icon-circle {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid var(--miku-cyan);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin-bottom: 8px; color: var(--miku-cyan);
            transition: 0.3s;
        }

        .dock-item:hover .icon-circle {
            background: var(--miku-cyan); color: white;
            box-shadow: 0 0 20px var(--miku-cyan);
        }

        .dock-label { color: white; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="snow-layer"></div>

    <nav class="top-nav">
        <div class="pill"><span>≡</span> GAMES • UPDATES</div>
        <div class="pill" onclick="panic()"><span>⚙</span> SETTINGS</div>
    </nav>

    <main class="main-display">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/2/22/Hatsune_Miku_V4X_box_art.png/220px-Hatsune_Miku_V4X_box_art.png" alt="Miku" class="miku-char">
        
        <h1 class="glowing-title">MIKU</h1>

        <div class="search-box">
            <input type="text" class="search-input" placeholder="Enter URL to Unblock..." id="proxy-input">
        </div>
    </main>

    <div class="dock-container">
        <div class="dock">
            <div class="dock-item" onclick="launch('https://google.com')">
                <div class="icon-circle">🌐</div><div class="dock-label">Web</div>
            </div>
            <div class="dock-item" onclick="launch('https://youtube.com')">
                <div class="icon-circle">▶</div><div class="dock-label">Media</div>
            </div>
            <div class="dock-item" onclick="launch('https://now.gg')">
                <div class="icon-circle">🎮</div><div class="dock-label">Games</div>
            </div>
            <div class="dock-item" onclick="launch('https://discord.com')">
                <div class="icon-circle">💬</div><div class="dock-label">Chat</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Falling Snowflake Engine
        const snowLayer = document.getElementById('snow-layer');
        const snowflakeImg = "https://cdn.discordapp.com/attachments/1444592922447057040/1479362390922367057/Screenshot_20260306-001033.CapCut.png?ex=69abc317&is=69aa7197&hm=4e28ae0e3516c60646a1fc2a81e0bc79565038d772195bdfc26a384fc5620547&";

        function spawnSnow() {
            const s = document.createElement('img');
            s.src = snowflakeImg;
            s.className = 'falling-snow';
            s.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 4 + 4; 
            s.style.animationDuration = duration + 's';
            s.style.width = (Math.random() * 20 + 20) + 'px';
            snowLayer.appendChild(s);
            setTimeout(() => s.remove(), duration * 1000);
        }
        setInterval(spawnSnow, 600);

        // 2. Unblocker Logic (about:blank cloaking)
        function launch(url) {
            let input = document.getElementById('proxy-input').value;
            let target = input ? input : url;
            if (!target.startsWith('http')) target = 'https://' + target;

            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.title = "Google Drive";
                const iframe = win.document.createElement('iframe');
                iframe.style = "position:fixed; top:0; left:0; width:100%; height:100%; border:none; margin:0; padding:0;";
                iframe.src = target;
                win.document.body.appendChild(iframe);
            }
        }

        document.getElementById('proxy-input').onkeydown = (e) => { if(e.key === 'Enter') launch(''); };

        // 3. Panic Mode
        function panic() { window.location.href = "https://classroom.google.com"; }
        document.onkeydown = (e) => { if(e.key.toLowerCase() === 'p') panic(); };
    </script>
</body>
</html>
