<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        /* =========================================================
           CORE VARIABLES & FONTS
        ========================================================= */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --miku-glow: #39c5bba8;
            --dark-glass: rgba(13, 25, 38, 0.65);
            --light-glass: rgba(57, 197, 187, 0.15);
            --border-glass: rgba(57, 197, 187, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Beautiful Anime Sky Background */
            background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 50%, #B0E0E6 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* =========================================================
           BACKGROUND CLOUDS & EFFECTS
        ========================================================= */
        .sky-effects {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(255,255,255,0.2) 0%, transparent 20%),
                radial-gradient(circle at 85% 60%, rgba(255,255,255,0.15) 0%, transparent 25%);
        }

        /* CSS Hexagon Tech Pattern overlaying the sky */
        .hex-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l25.98 15v30L30 60 4.02 45V15L30 0zm0 2.31L6.02 16.16v27.68L30 57.69l23.98-13.85V16.16L30 2.31z' fill='%23ffffff' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: 1;
        }

        /* =========================================================
           TOP NAVIGATION (Matches the pill-shapes)
        ========================================================= */
        .top-nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            padding: 30px 50px;
        }

        .nav-pill {
            background: var(--dark-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 12px 25px;
            color: white;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .nav-pill:hover {
            border-color: var(--miku-cyan);
            box-shadow: 0 0 20px var(--miku-glow);
            transform: translateY(-2px);
        }

        .nav-pill span {
            color: var(--miku-cyan);
            font-size: 1.2rem;
        }

        /* =========================================================
           CENTER CONTENT (Floating Miku & Neon Text)
        ========================================================= */
        .center-stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            margin-top: -50px; /* Adjusts her vertical position */
        }

        /* The floating animation for the character */
        @keyframes floatCharacter {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-25px); }
            100% { transform: translateY(0px); }
        }

        .miku-character {
            height: 400px; /* Size of the Miku image */
            width: auto;
            animation: floatCharacter 6s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(57, 197, 187, 0.4));
            z-index: 2;
        }

        .miku-text {
            font-size: 9rem;
            font-weight: 900;
            color: white;
            text-shadow: 
                0 0 10px var(--miku-cyan),
                0 0 20px var(--miku-cyan),
                0 0 40px var(--miku-cyan),
                0 0 80px var(--miku-cyan);
            letter-spacing: 15px;
            margin-top: -150px; /* Pulls text up to overlap the image */
            z-index: 3;
        }

        /* The Glass Search Bar */
        .search-bar-container {
            margin-top: -20px;
            z-index: 4;
            width: 600px;
            background: linear-gradient(90deg, rgba(57,197,187,0.1) 0%, rgba(255,255,255,0.2) 50%, rgba(57,197,187,0.1) 100%);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--border-glass);
            border-radius: 50px;
            display: flex;
            align-items: center;
            padding: 15px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .search-bar-container:focus-within {
            box-shadow: 0 0 30px var(--miku-glow);
            border-color: var(--miku-cyan);
            transform: scale(1.02);
        }

        .search-icon {
            font-size: 1.5rem;
            color: var(--miku-cyan);
            margin-right: 15px;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1.2rem;
            width: 100%;
            font-weight: 600;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* =========================================================
           BOTTOM DOCK
        ========================================================= */
        .bottom-dock-container {
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .dock-panel {
            background: var(--dark-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 2px solid var(--miku-cyan);
            border-left: 2px solid var(--border-glass);
            border-right: 2px solid var(--border-glass);
            border-radius: 30px 30px 0 0;
            padding: 25px 60px;
            display: flex;
            gap: 60px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        .dock-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dock-app:hover {
            transform: translateY(-15px);
        }

        .app-icon-bg {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            border: 2px solid var(--miku-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(255,255,255,0.05);
            margin-bottom: 10px;
            color: var(--miku-cyan);
            transition: 0.3s;
        }

        .dock-app:hover .app-icon-bg {
            background: var(--miku-cyan);
            color: white;
            box-shadow: 0 0 20px var(--miku-glow);
        }

        .app-label {
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* =========================================================
           FALLING MIKU PARTICLE SYSTEM (The Ceiling Effect)
        ========================================================= */
        #particle-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5; /* Behind the UI, in front of the sky */
            overflow: hidden;
        }

        .falling-item {
            position: absolute;
            top: -100px;
            width: 40px; /* Size of the falling images */
            height: auto;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="sky-effects"></div>
    <div class="hex-pattern"></div>

    <div id="particle-container"></div>

    <nav class="top-nav">
        <div class="nav-pill" onclick="panic()">
            <span>≡</span> GAMES • UPDATES
        </div>
        <div class="nav-pill">
            <span>⚙</span> SETTINGS
        </div>
    </nav>

    <main class="center-stage">
        
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/2/22/Hatsune_Miku_V4X_box_art.png/220px-Hatsune_Miku_V4X_box_art.png" alt="Miku Render" class="miku-character">
        
        <h1 class="miku-text">MIKU</h1>

        <div class="search-bar-container">
            <div class="search-icon">🔍</div>
            <input type="text" class="search-input" placeholder="Search games or URLs..." id="url-input">
        </div>
    </main>

    <footer class="bottom-dock-container">
        <div class="dock-panel">
            <div class="dock-app" onclick="launchApp('https://google.com')">
                <div class="app-icon-bg">🌐</div>
                <div class="app-label">Web Browser</div>
            </div>
            <div class="dock-app" onclick="launchApp('https://youtube.com')">
                <div class="app-icon-bg">▶</div>
                <div class="app-label">Video Hub</div>
            </div>
            <div class="dock-app" onclick="launchApp('https://now.gg')">
                <div class="app-icon-bg">🎮</div>
                <div class="app-label">Game Portal</div>
            </div>
            <div class="dock-app" onclick="launchApp('https://discord.com')">
                <div class="app-icon-bg">💬</div>
                <div class="app-label">Chat Room</div>
            </div>
        </div>
    </footer>

    <script>
        /* =========================================================
           1. FALLING MIKU ENGINE
        ========================================================= */
        const particleContainer = document.getElementById('particle-container');
        
        // PASTE THE LINK TO THE IMAGE YOU WANT FALLING FROM THE CEILING HERE
        const fallingImageUrl = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Vocaloid_logo.svg/512px-Vocaloid_logo.svg.png"; 

        function createFallingMiku() {
            const particle = document.createElement('img');
            particle.src = fallingImageUrl;
            particle.classList.add('falling-item');

            // Randomize starting position on the X axis
            particle.style.left = Math.random() * 100 + 'vw';
            
            // Randomize fall speed (between 5 and 10 seconds)
            const fallDuration = Math.random() * 5 + 5;
            particle.style.animationDuration = fallDuration + 's';

            // Randomize image size slightly
            const size = Math.random() * 30 + 30; // Between 30px and 60px
            particle.style.width = size + 'px';

            particleContainer.appendChild(particle);

            // Delete the image after it falls off screen to prevent lag
            setTimeout(() => {
                particle.remove();
            }, fallDuration * 1000);
        }

        // Drop a new image from the ceiling every 800 milliseconds
        setInterval(createFallingMiku, 800);

        /* =========================================================
           2. LIGHTSPEED/CONTENT KEEPER BYPASS LOGIC
        ========================================================= */
        function launchApp(targetUrl) {
            let inputUrl = document.getElementById('url-input').value;
            let finalUrl = inputUrl ? inputUrl : targetUrl;

            // Auto-format the link
            if (!finalUrl.startsWith('http') && finalUrl.trim() !== '') {
                finalUrl = 'https://' + finalUrl;
            }

            // Cloak mechanism (Opens the site hidden in an about:blank tab)
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.title = "Google Drive"; // Decoy Title
                
                // Set the decoy Favicon
                let link = win.document.createElement('link');
                link.rel = 'icon';
                link.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
                win.document.head.appendChild(link);

                // Hide everything in an iframe
                win.document.body.style.margin = '0';
                win.document.body.style.height = '100vh';
                win.document.body.style.overflow = 'hidden';

                const iframe = win.document.createElement('iframe');
                iframe.style.border = 'none';
                iframe.style.width = '100vw';
                iframe.style.height = '100vh';
                iframe.src = finalUrl;
                
                win.document.body.appendChild(iframe);
            }
        }

        // Allow pressing 'Enter' inside the search bar to launch it
        document.getElementById('url-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                launchApp('');
            }
        });

        // PANIC BUTTON: Quickly redirects current page if a teacher walks by
        function panic() {
            window.location.replace("https://classroom.google.com");
        }
    </script>
</body>
</html>
