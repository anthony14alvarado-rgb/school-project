<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --dark-glass: rgba(13, 25, 38, 0.85);
            --border-glass: rgba(57, 197, 187, 0.5);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', sans-serif; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 50%, #B0E0E6 100%);
            position: relative; touch-action: none;
        }

        #snowCanvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .os-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 100;
        }

        .top-bar { display: flex; justify-content: space-between; padding: 25px; }
        .btn-glass { 
            background: var(--dark-glass); backdrop-filter: blur(20px); 
            border: 1.5px solid var(--border-glass); border-radius: 40px; 
            padding: 15px 25px; color: white; font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .main-view { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        .search-bar { 
            width: 90%; max-width: 550px; 
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(30px); 
            border: 2px solid var(--border-glass); border-radius: 50px; 
            padding: 20px; display: flex; align-items: center;
        }
        .search-input { background: transparent; border: none; outline: none; color: white; font-size: 1.2rem; width: 100%; text-align: center; font-weight: 700; }

        .bottom-dock { display: flex; justify-content: center; padding-bottom: 40px; }
        .dock-container { 
            background: var(--dark-glass); backdrop-filter: blur(25px); 
            border: 1.5px solid var(--border-glass); border-radius: 35px; 
            padding: 15px 35px; display: flex; gap: 30px;
        }
        .dock-icon { color: var(--miku-cyan); font-weight: 900; font-size: 0.8rem; text-align: center; }

        #miku-root {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2147483647; 
        }
    </style>
</head>
<body>

    <canvas id="snowCanvas"></canvas>

    <div class="os-interface">
        <header class="top-bar">
            <div class="btn-glass">≡ APPS • DEV</div>
            <div class="btn-glass" onclick="location.replace('https://classroom.google.com')">⚙ SETTINGS</div>
        </header>

        <main class="main-view">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search Titan OS..." id="url-box">
            </div>
        </main>

        <footer class="bottom-dock">
            <div class="dock-container">
                <div class="dock-icon" onclick="sys_launch('https://google.com')">WEB</div>
                <div class="dock-icon" onclick="sys_launch('https://youtube.com')">VIDEO</div>
                <div class="dock-icon" onclick="sys_launch('https://now.gg')">GAMES</div>
                <div class="dock-icon" onclick="sys_launch('https://discord.com')">SOCIAL</div>
            </div>
        </footer>
    </div>

    <div id="miku-root"></div>

    <script>
        const ASSETS = {
            snow: "https://cdn.discordapp.com/attachments/1444592922447057040/1479367313026191401/Screenshot_20260306-003642.Chrome.png?ex=69abc7ac&is=69aa762c&hm=66b2ad1775d64dcc27d2fb69cfb24a4faa73d4cdd0d2797e989fe71d53849d64&",
            idle: "https://cdn.discordapp.com/attachments/1444592922447057040/1479376567242330163/Screenshot_20260306-010851.Photos.png?ex=69abd04b&is=69aa7ecb&hm=d9ad588ac9f7b1bcaeb6d7906ef3caf0322c694b945b5c2f2ece4b5e18f9af14&",
            click: "https://cdn.discordapp.com/attachments/1444592922447057040/1479376566839410859/Screenshot_20260306-011055.Photos.png?ex=69abd04b&is=69aa7ecb&hm=bc9b954a686baf68327d99f4a796753c77387c5fd842ee401b331b0ab8ebfd95&"
        };

        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        const snowImg = new Image();
        snowImg.src = ASSETS.snow;

        let particles = [];
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = initCanvas;
        initCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 20 + 15;
                this.speed = Math.random() * 2 + 1;
                this.angle = Math.random() * 360;
            }
            update() {
                this.y += this.speed;
                this.angle += 1;
                if (this.y > canvas.height) {
                    this.y = -50;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                
                // THE FIX: 'screen' or 'lighter' blend mode makes the white boxes disappear
                ctx.globalCompositeOperation = 'screen'; 
                ctx.filter = 'contrast(2) brightness(0.8) grayscale(1)'; 
                ctx.drawImage(snowImg, -this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        for(let i=0; i<40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        const root = document.getElementById('miku-root');
        const miku = document.createElement('img');
        miku.src = ASSETS.idle;
        miku.style.cssText = `
            position: fixed; width: 90px; height: auto; display: none;
            pointer-events: none; mix-blend-mode: multiply;
            will-change: transform; transform: translateZ(0); 
            filter: contrast(1.1) brightness(1.1);
        `;
        root.appendChild(miku);

        function handleTouch(e) {
            const t = e.touches[0];
            miku.style.transform = `translate3d(${t.clientX - 45}px, ${t.clientY - 45}px, 0)`;
        }

        window.addEventListener('touchstart', (e) => {
            miku.style.display = 'block';
            miku.src = ASSETS.click;
            handleTouch(e);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            handleTouch(e);
            e.preventDefault(); 
        }, {passive: false});

        window.addEventListener('touchend', () => {
            miku.src = ASSETS.idle;
        });

        function sys_launch(url) {
            let target = document.getElementById('url-box').value || url;
            if (!target.startsWith('http')) target = 'https://' + target;
            const shell = window.open('about:blank', '_blank');
            if (shell) {
                shell.document.body.style.margin = "0";
                const frame = shell.document.createElement('iframe');
                frame.style = "width:100vw; height:100vh; border:none;";
                frame.src = target;
                shell.document.body.appendChild(frame);
            }
        }
    </script>
</body>
</html>
