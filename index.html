<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Miku | Home</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        :root {
            --miku-teal: #39C5BB;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(57, 197, 187, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glassmorphism Background */
        .dashboard {
            width: 80%;
            max-width: 900px;
            height: 60vh;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        h1 {
            color: var(--miku-teal);
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--miku-teal);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .app-icon {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-icon:hover {
            transform: scale(1.1);
        }

        .app-icon img {
            width: 60px;
            border-radius: 12px;
            border: 2px solid var(--miku-teal);
        }

        .app-label {
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* Hidden Panic Key Overlay */
        #panic-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; color: black;
            z-index: 9999; padding: 50px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1 id="dynamic-title">Project Miku</h1>
        <p>Select a module to begin.</p>

        <div class="app-grid">
            <div class="app-icon" onclick="launchApp('https://google.com')">
                <img src="https://api.iconify.design/logos:google-icon.svg" alt="App">
                <div class="app-label">Search</div>
            </div>

            <div class="app-icon" onclick="launchApp('https://example.com')">
                <img src="https://api.iconify.design/fluent-emoji:leek.svg" alt="Miku">
                <div class="app-label">Vocaloid Hub</div>
            </div>
        </div>
    </div>

    <div id="panic-screen">
        <h1>Google Docs</h1>
        <hr>
        <p>Loading document history...</p>
    </div>

    <script>
        // 1. The About:Blank Cloaker (Bypasses Lightspeed history)
        function launchApp(url) {
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.body.style.margin = '0';
                win.document.body.style.height = '100vh';
                const iframe = win.document.createElement('iframe');
                iframe.style.border = 'none';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.src = url;
                win.document.body.appendChild(iframe);
            }
        }

        // 2. Panic Key Logic (Press 'P' to hide everything)
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'p') {
                document.getElementById('panic-screen').style.display = 'block';
                document.title = "Google Docs";
            }
        });

        // 3. Simple Base64 Decoder for Titles (Countering Keyword Scanners)
        // 'UHJveHkgSHVi' is Base64 for 'Proxy Hub'
        const secretTitle = 'UHJveHkgSHVi';
        console.log("System Initialized...");
    </script>
</body>
</html>
