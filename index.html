<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Kit | Nexus Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
    <style>
        /* --- Z-KIT OFFICIAL THEME ENGINE --- */
        :root {
            --zk-bg: #09090b;
            --zk-surface: #121214;
            --zk-nav: #000000;
            --zk-border: #27272a;
            --zk-text: #ffffff;
            --zk-dim: #a1a1aa;
            --zk-accent: #ffffff;
            --zk-glow: rgba(255, 255, 255, 0.1);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--zk-bg);
            color: var(--zk-text);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
            animation: pageEntry 0.6s ease-out;
        }

        @keyframes pageEntry {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- LEFT-SIDE NAVIGATION (MIDDLE LEFT) --- */
        nav {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            z-index: 2000;
        }

        .zk-brand {
            font-weight: 900;
            font-size: 22px;
            margin-bottom: 24px;
            background: linear-gradient(to right, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .zk-menu {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .zk-link {
            color: var(--zk-dim);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 0;
            position: relative;
        }

        .zk-link:hover,
        .zk-link.active {
            color: var(--zk-text);
        }

        .zk-link.active::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 18px;
            border-radius: 999px;
            background: #fff;
        }

        /* --- HERO SEARCH SECTION --- */
        .zk-hero {
            padding: 80px 20px 60px 120px;
            text-align: left;
            background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
        }

        .zk-hero h1 {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .zk-hero p {
            color: var(--zk-dim);
        }

        .zk-search-box {
            max-width: 550px;
            margin-top: 30px;
            position: relative;
        }

        .zk-main-input {
            width: 100%;
            padding: 14px 25px;
            border-radius: 8px;
            background: var(--zk-surface);
            border: 1px solid var(--zk-border);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .zk-main-input:focus {
            border-color: #52525b;
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
        }

        .zk-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 20px 80px 120px;
        }

        .zk-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--zk-border);
            padding-bottom: 10px;
        }

        .zk-section-header h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--zk-dim);
        }

        /* --- THE APPS GRID --- */
        .zk-app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 80px;
        }

        .zk-app-card {
            background: var(--zk-surface);
            border: 1px solid var(--zk-border);
            border-radius: 12px;
            padding: 18px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 0 1px transparent;
        }

        .zk-app-card img {
            width: 40px;
            height: 40px;
        }

        .zk-app-card h3 {
            font-size: 16px;
        }

        .zk-app-card:hover {
            transform: translateY(-2px);
            border-color: #fff;
            box-shadow: 0 0 25px var(--zk-glow);
        }

        /* --- THE GAMES GRID (RESTORATION) --- */
        .zk-game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .zk-game-item {
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/10;
            border: 1px solid var(--zk-border);
            cursor: pointer;
            transition: var(--transition);
        }

        .zk-game-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .zk-game-item:hover {
            transform: scale(1.02);
            border-color: #fff;
        }

        .zk-game-item:hover img {
            filter: brightness(0.7);
        }

        .zk-game-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        /* --- GLOBAL CHAT DRAWER --- */
        #chat-drawer {
            position: fixed;
            right: -400px;
            top: 0;
            width: 350px;
            height: 100vh;
            background: #000;
            border-left: 1px solid var(--zk-border);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1500;
            display: flex;
            flex-direction: column;
        }

        #chat-drawer.open {
            right: 0;
        }

        .chat-view {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .chat-input-row {
            padding: 20px;
            border-top: 1px solid var(--zk-border);
            background: #0a0a0a;
        }

        .zk-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .zk-btn:hover {
            background: #e5e5e5;
        }

        /* --- SETTINGS MODAL --- */
        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .settings-card {
            background: var(--zk-surface);
            border: 1px solid var(--zk-border);
            width: 450px;
            padding: 40px;
            border-radius: 16px;
        }

        .settings-card h2 {
            margin-bottom: 25px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .zk-dim {
            color: var(--zk-dim);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 800px) {
            nav {
                top: 10px;
                left: 10px;
                transform: none;
                flex-direction: row;
                align-items: center;
                gap: 16px;
                background: rgba(0,0,0,0.7);
                padding: 10px 14px;
                border-radius: 999px;
            }

            .zk-brand {
                margin-bottom: 0;
                margin-right: 10px;
                font-size: 18px;
            }

            .zk-menu {
                flex-direction: row;
                gap: 12px;
            }

            .zk-link.active::after {
                display: none;
            }

            .zk-hero {
                padding: 90px 16px 40px 16px;
                text-align: left;
            }

            .zk-container {
                padding: 10px 16px 60px 16px;
            }

            #chat-drawer {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="zk-brand">NEXUS</div>
        <div class="zk-menu">
            <a class="zk-link active" href="#">Home</a>
            <a class="zk-link" onclick="toggleChat()">Community</a>
            <!-- Games opens in a new tab / task -->
            <a class="zk-link" href="games.html" target="_blank">Games</a>
            <a class="zk-link" href="https://discord.com" target="_blank">Discord</a>
            <a class="zk-link" onclick="toggleSettings()">Settings</a>
        </div>
    </nav>

    <div class="zk-hero">
        <h1>Z-Kit Framework</h1>
        <p>The absolute standard in unblocked exploration.</p>
        <div class="zk-search-box">
            <input
                type="text"
                class="zk-main-input"
                placeholder="Search applications or game titles..."
                onkeydown="if(event.key==='Enter') window.open('https://google.com/search?q='+this.value)"
            >
        </div>
    </div>

    <div class="zk-container" id="home-sector">
        <div class="zk-section-header"><h2>Verified Applications</h2></div>
        <div class="zk-app-grid">
            <a class="zk-app-card" href="https://youtube.com" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
                <h3>YouTube</h3>
            </a>
            <a class="zk-app-card" href="https://tiktok.com" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">
                <h3>TikTok</h3>
            </a>
            <a class="zk-app-card" href="https://soundcloud.com" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/145/145809.png">
                <h3>SoundCloud</h3>
            </a>
            <a class="zk-app-card" href="https://twitch.tv" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968819.png">
                <h3>Twitch</h3>
            </a>
        </div>
    </div>

    <!-- CHAT DRAWER -->
    <div id="chat-drawer">
        <div class="chat-view" id="cv">
            <div id="auth">
                <p style="margin-bottom:15px; font-size:12px;" class="zk-dim">
                    Identify yourself to join the comms.
                </p>
                <input type="text" id="uname" class="zk-main-input" placeholder="Callsign...">
                <button onclick="start()" class="zk-btn">Connect</button>
            </div>
            <div id="log"></div>
        </div>
        <div class="chat-input-row">
            <input
                type="text"
                id="msg"
                class="zk-main-input"
                placeholder="Transmission..."
                onkeydown="if(event.key==='Enter') send()"
            >
        </div>
    </div>

    <!-- SETTINGS OVERLAY -->
    <div id="settings-overlay" onclick="toggleSettings()">
        <div class="settings-card" onclick="event.stopPropagation()">
            <h2>System Config</h2>
            <div class="setting-row">
                <span>Stealth Mode (Panic Key: ~)</span>
                <input type="checkbox" checked>
            </div>
            <div class="setting-row">
                <span>HD Rendering</span>
                <input type="checkbox" checked>
            </div>
            <button onclick="toggleSettings()" class="zk-btn">Close</button>
        </div>
    </div>

    <script>
        let drone, room;

        function toggleChat() {
            document.getElementById('chat-drawer').classList.toggle('open');
        }

        function toggleSettings() {
            const s = document.getElementById('settings-overlay');
            s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
        }

        function start() {
            const n = document.getElementById('uname').value || "Commander";
            document.getElementById('auth').style.display = 'none';

            drone = new ScaleDrone('yiS12sYPLP793Q0A', { data: { name: n } });

            drone.on('open', error => {
                if (error) {
                    console.error(error);
                    return;
                }
                room = drone.subscribe('observable-nexus-bridge');
                room.on('data', (d, m) => {
                    const div = document.createElement('div');
                    div.style.marginBottom = "15px";
                    div.innerHTML = `
                        <span style="color:var(--zk-dim); font-size:11px;">
                            ${m.authData.name}
                        </span><br>${d}
                    `;
                    document.getElementById('log').appendChild(div);
                    const cv = document.getElementById('cv');
                    cv.scrollTop = cv.scrollHeight;
                });
            });
        }

        function send() {
            const i = document.getElementById('msg');
            if (i.value.trim() && drone) {
                drone.publish({
                    room: 'observable-nexus-bridge',
                    message: i.value
                });
                i.value = "";
            }
        }

        window.onkeydown = (e) => {
            if (e.key === '~') window.location.href = "https://google.com";
        };
    </script>
</body>
</html>
