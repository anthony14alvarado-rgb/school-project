<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --dark-glass: rgba(13, 25, 38, 0.75);
            --border-glass: rgba(57, 197, 187, 0.4);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', sans-serif; user-select: none;
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 50%, #B0E0E6 100%);
            background-size: cover;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Snowflake Layer */
        #snow-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        .falling-item {
            position: absolute; top: -50px;
            width: 25px; height: auto;
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 5px white);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* UI Elements */
        .top-nav {
            position: relative; z-index: 10;
            display: flex; justify-content: space-between; padding: 30px 50px;
        }

        .nav-pill {
            background: var(--dark-glass); backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass); border-radius: 30px;
            padding: 12px 25px; color: white; font-weight: 700;
            letter-spacing: 2px;
        }

        .center-stage {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex-grow: 1;
        }

        .search-container {
            width: 600px; z-index: 10;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px);
            border: 2px solid var(--border-glass); border-radius: 60px;
            padding: 18px 35px; display: flex; align-items: center;
            box-shadow: 0 15px 45px rgba(0,0,0,0.3);
        }

        .search-input {
            background: transparent; border: none; outline: none;
            color: white; font-size: 1.25rem; width: 100%; font-weight: 600;
            text-align: center;
        }

        .dock {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: 40px; z-index: 10;
        }

        .dock-bar {
            background: var(--dark-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: 35px;
            padding: 18px 45px; display: flex; gap: 45px;
        }

        .dock-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--miku-cyan); font-weight: 800; font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div id="snow-layer"></div>

    <nav class="top-nav">
        <div class="nav-pill">≡ GAMES • UPDATES</div>
        <div class="nav-pill" onclick="panic()">⚙ SETTINGS</div>
    </nav>

    <main class="center-stage">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search or Enter URL..." id="url-input">
        </div>
    </main>

    <footer class="dock">
        <div class="dock-bar">
            <div class="dock-item" onclick="launch('https://google.com')">🌐 WEB</div>
            <div class="dock-item" onclick="launch('https://youtube.com')">▶ VIDEO</div>
            <div class="dock-item" onclick="launch('https://now.gg')">🎮 GAMES</div>
            <div class="dock-item" onclick="launch('https://discord.com')">💬 CHAT</div>
        </div>
    </footer>

    <script>
        // --- SNOWFLAKE LOGIC ---
        const snowImg = "https://cdn.discordapp.com/attachments/1444592922447057040/1479367313026191401/Screenshot_20260306-003642.Chrome.png?ex=69abc7ac&is=69aa762c&hm=66b2ad1775d64dcc27d2fb69cfb24a4faa73d4cdd0d2797e989fe71d53849d64&";
        const snowLayer = document.getElementById('snow-layer');

        function spawn() {
            const s = document.createElement('img');
            s.src = snowImg; s.className = 'falling-item';
            s.style.left = Math.random() * 100 + 'vw';
            const d = Math.random() * 4 + 6;
            s.style.animationDuration = d + 's';
            s.style.width = (Math.random() * 20 + 10) + 'px';
            snowLayer.appendChild(s);
            setTimeout(() => s.remove(), d * 1000);
        }
        setInterval(spawn, 500);

        // --- MIKU TWO-STATE TOUCH CURSOR ---
        const mikuIdle = "https://cdn.discordapp.com/attachments/1444592922447057040/1479376567242330163/Screenshot_20260306-010851.Photos.png?ex=69abd04b&is=69aa7ecb&hm=d9ad588ac9f7b1bcaeb6d7906ef3caf0322c694b945b5c2f2ece4b5e18f9af14&";
        const mikuClick = "https://cdn.discordapp.com/attachments/1444592922447057040/1479376566839410859/Screenshot_20260306-011055.Photos.png?ex=69abd04b&is=69aa7ecb&hm=bc9b954a686baf68327d99f4a796753c77387c5fd842ee401b331b0ab8ebfd95&";

        const mikuCursor = document.createElement('img');
        mikuCursor.src = mikuIdle;
        mikuCursor.style = "position:fixed; width:70px; height:auto; pointer-events:none; z-index:10000; display:none; mix-blend-mode:multiply;";
        document.body.appendChild(mikuCursor);

        function moveMiku(e) {
            const touch = e.touches[0];
            mikuCursor.style.left = (touch.clientX - 35) + 'px';
            mikuCursor.style.top = (touch.clientY - 35) + 'px';
        }

        window.addEventListener('touchstart', (e) => {
            mikuCursor.style.display = 'block';
            mikuCursor.src = mikuClick;
            moveMiku(e);
        });

        window.addEventListener('touchmove', (e) => {
            moveMiku(e);
        });

        window.addEventListener('touchend', () => {
            mikuCursor.src = mikuIdle;
        });

        // --- CORE FUNCTIONS ---
        function launch(url) {
            let val = document.getElementById('url-input').value || url;
            if (!val.startsWith('http')) val = 'https://' + val;
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.title = "Google Drive";
                const iframe = win.document.createElement('iframe');
                iframe.style = "position:fixed; top:0; left:0; width:100%; height:100%; border:none; margin:0;";
                iframe.src = val;
                win.document.body.appendChild(iframe);
            }
        }

        document.getElementById('url-input').onkeydown = (e) => { if(e.key === 'Enter') launch(''); };
        function panic() { window.location.replace("https://classroom.google.com"); }
    </script>
</body>
</html>
