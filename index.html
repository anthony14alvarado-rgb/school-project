<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --miku-glow: #39c5bba8;
            --dark-glass: rgba(13, 25, 38, 0.65);
            --border-glass: rgba(57, 197, 187, 0.4);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', sans-serif; user-select: none;
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            /* Bringing back the Blue Sky Theme */
            background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 50%, #B0E0E6 100%);
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Snowflake Layer */
        #snow-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        .falling-item {
            position: absolute; top: -50px;
            width: 35px; height: auto;
            filter: drop-shadow(0 0 5px var(--miku-cyan));
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* Top Nav */
        .top-nav {
            position: relative; z-index: 10;
            display: flex; justify-content: space-between; padding: 30px 50px;
        }

        .nav-pill {
            background: var(--dark-glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass); border-radius: 30px;
            padding: 12px 25px; color: white; font-weight: 700;
            letter-spacing: 2px; cursor: pointer; transition: 0.3s;
        }

        /* Center Content */
        .center-stage {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex-grow: 1; margin-top: -30px;
        }

        .miku-character {
            height: 480px; width: auto;
            /* This removes the white background from your screenshot */
            mix-blend-mode: screen; 
            animation: floatCharacter 6s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes floatCharacter {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .miku-text {
            font-size: 9rem; font-weight: 900; color: white;
            text-shadow: 0 0 10px var(--miku-cyan), 0 0 30px var(--miku-cyan), 0 0 60px var(--miku-cyan);
            letter-spacing: 15px; margin-top: -160px; z-index: 3;
        }

        /* Search Bar */
        .search-container {
            width: 600px; margin-top: 20px; z-index: 4;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px);
            border: 2px solid var(--border-glass); border-radius: 50px;
            padding: 15px 30px; display: flex; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-input {
            background: transparent; border: none; outline: none;
            color: white; font-size: 1.2rem; width: 100%; font-weight: 600;
        }

        /* Bottom Dock */
        .dock {
            width: 100%; display: flex; justify-content: center;
            padding-bottom: 30px; z-index: 10;
        }

        .dock-bar {
            background: var(--dark-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: 30px;
            padding: 15px 40px; display: flex; gap: 40px;
        }

        .dock-item {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.3s; color: var(--miku-cyan);
        }

        .dock-item:hover { transform: translateY(-10px); color: white; }
    </style>
</head>
<body>

    <div id="snow-layer"></div>

    <nav class="top-nav">
        <div class="nav-pill">≡ GAMES • UPDATES</div>
        <div class="nav-pill" onclick="panic()">⚙ SETTINGS</div>
    </nav>

    <main class="center-stage">
        <img src="https://cdn.discordapp.com/attachments/1444592922447057040/1479362390607790080/Screenshot_20260306-001639.CapCut.png?ex=69abc317&is=69aa7197&hm=c862ccb5e31fe132e5bfe10811612c53b0d53ffc8687bb4cc7687221329d3ee4&" class="miku-character">
        
        <h1 class="miku-text">MIKU</h1>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search games or URLs..." id="url-input">
        </div>
    </main>

    <footer class="dock">
        <div class="dock-bar">
            <div class="dock-item" onclick="launch('https://google.com')">🌐 WEB</div>
            <div class="dock-item" onclick="launch('https://youtube.com')">▶ VIDEO</div>
            <div class="dock-item" onclick="launch('https://now.gg')">🎮 GAMES</div>
            <div class="dock-item" onclick="launch('https://discord.com')">💬 CHAT</div>
        </div>
    </footer>

    <script>
        // Snowflake Engine
        const snowLayer = document.getElementById('snow-layer');
        const snowImg = "https://cdn.discordapp.com/attachments/1444592922447057040/1479362390922367057/Screenshot_20260306-001033.CapCut.png?ex=69abc317&is=69aa7197&hm=4e28ae0e3516c60646a1fc2a81e0bc79565038d772195bdfc26a384fc5620547&";

        function spawn() {
            const s = document.createElement('img');
            s.src = snowImg; s.className = 'falling-item';
            s.style.left = Math.random() * 100 + 'vw';
            const d = Math.random() * 5 + 5;
            s.style.animationDuration = d + 's';
            snowLayer.appendChild(s);
            setTimeout(() => s.remove(), d * 1000);
        }
        setInterval(spawn, 700);

        function launch(url) {
            let val = document.getElementById('url-input').value || url;
            if (!val.startsWith('http')) val = 'https://' + val;
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.body.style.margin = '0';
                const iframe = win.document.createElement('iframe');
                iframe.style = "width:100vw; height:100vh; border:none;";
                iframe.src = val;
                win.document.body.appendChild(iframe);
            }
        }

        document.getElementById('url-input').onkeydown = (e) => { if(e.key === 'Enter') launch(''); };
        function panic() { window.location.href = "https://classroom.google.com"; }
    </script>
</body>
</html>
