<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --dark-glass: rgba(13, 25, 38, 0.7);
            --border-glass: rgba(57, 197, 187, 0.5);
        }

        /* PC CURSOR LOGIC */
        .miku-cursor-active { cursor: none !important; }
        .miku-cursor-active input, .miku-cursor-active div, .miku-cursor-active button { cursor: none !important; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        input { user-select: text !important; } 

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 50%, #B0E0E6 100%);
            background-size: cover; background-position: center;
            position: relative; touch-action: none; transition: background 0.5s ease;
        }

        #snowCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2;
            mix-blend-mode: screen; 
            filter: invert(1) contrast(2) brightness(1.5) grayscale(1); 
        }

        .os-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 100;
        }

        .top-bar { display: flex; justify-content: space-between; padding: 25px; position: relative; }
        .btn-glass { 
            background: var(--dark-glass); backdrop-filter: blur(20px); 
            border: 1.5px solid var(--border-glass); border-radius: 40px; 
            padding: 15px 25px; color: white; font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer;
        }

        .dropdown-menu {
            position: absolute; top: 90px; width: 300px; background: var(--dark-glass);
            backdrop-filter: blur(25px); border: 1.5px solid var(--border-glass);
            border-radius: 20px; padding: 20px; color: white; display: none; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 1000;
        }
        .dropdown-menu.active { display: flex; }
        #updateMenu { left: 25px; }
        #settingsMenu { right: 25px; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .setting-input { background: rgba(255,255,255,0.1); border: 1px solid var(--border-glass); color: white; border-radius: 10px; padding: 8px; width: 100%; margin-top: 5px; outline: none; }
        .toggle-btn { padding: 6px 12px; border-radius: 10px; background: var(--miku-cyan); border: none; font-weight: 900; cursor: pointer; color: #0d1926; }

        .main-view { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; gap: 15px; }
        
        .welcome-text {
            color: white; font-weight: 900; font-size: 2.2rem; 
            text-shadow: 0 0 15px rgba(255,255,255,0.7), 0 0 25px var(--miku-cyan); 
            letter-spacing: 3px; text-transform: uppercase;
        }

        .search-bar { 
            width: 90%; max-width: 550px; 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(30px); 
            border: 2px solid var(--border-glass); border-radius: 50px; 
            padding: 20px; display: flex; align-items: center; position: relative; overflow: hidden;
        }
        
        /* SEARCH BAR GLOW TRACKING */
        .search-bar::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), var(--miku-cyan), transparent 40%);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 1;
        }
        .search-bar:hover::before { opacity: 0.5; }

        .search-input { background: transparent; border: none; outline: none; color: white; font-size: 1.2rem; width: 100%; text-align: center; font-weight: 700; position: relative; z-index: 2; }

        .links-bar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 90%; margin-top: 10px; }
        .link-item { 
            background: var(--dark-glass); border: 1.5px solid var(--border-glass); 
            padding: 10px 18px; border-radius: 20px; color: white; 
            font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px; position: relative; z-index: 10;
        }
        .link-item img { width: 18px; height: 18px; border-radius: 4px; pointer-events: none; }
        .link-item:hover { background: var(--miku-cyan); color: #0d1926; transform: scale(1.05); }

        .bottom-dock { display: flex; justify-content: center; padding-bottom: 40px; }
        .dock-container { background: var(--dark-glass); backdrop-filter: blur(25px); border: 1.5px solid var(--border-glass); border-radius: 35px; padding: 15px 35px; display: flex; gap: 30px; }
        .dock-icon { color: var(--miku-cyan); font-weight: 900; font-size: 0.8rem; text-align: center; cursor: pointer; }

        #miku-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2147483647; }
    </style>
</head>
<body class="miku-cursor-active" id="mainBody">

    <canvas id="snowCanvas"></canvas>

    <div class="os-interface">
        <header class="top-bar">
            <div class="btn-glass" onclick="toggleMenu('updateMenu')">≡ APPS • DEV</div>
            <div id="updateMenu" class="dropdown-menu">
                <p style="font-weight:900; color:var(--miku-cyan); border-bottom:1px solid rgba(255,255,255,0.2);">UPDATE 6.27</p>
                <ul style="list-style:none; font-size:0.85rem; padding-top:10px;">
                    <li>• Custom Wallpaper Support</li>
                    <li>• Dynamic Theme Colors</li>
                    <li>• Snow Toggle Control</li>
                    <li>• Restored Full Asset Logic</li>
                </ul>
            </div>

            <div class="btn-glass" onclick="toggleMenu('settingsMenu')">⚙ SETTINGS</div>
            <div id="settingsMenu" class="dropdown-menu">
                <p style="font-weight:900; color:var(--miku-cyan); text-align:center; margin-bottom:10px;">SYSTEM PANEL</p>
                <div class="setting-row"><span>Miku Cursor</span><button id="cursorToggle" class="toggle-btn" onclick="toggleCursor()">ON</button></div>
                <div class="setting-row"><span>Snow Effect</span><button id="snowToggle" class="toggle-btn" onclick="toggleSnow()">ON</button></div>
                <div class="setting-row"><span>Theme Color</span><input type="color" id="themePicker" value="#39C5BB" oninput="setThemeColor(this.value)" style="background:none; border:none; width:40px; height:25px; cursor:pointer;"></div>
                <div style="margin-top:10px;">
                    <span style="font-size:0.75rem;">WALLPAPER URL:</span>
                    <input type="text" class="setting-input" placeholder="Paste image link here..." onchange="setWallpaper(this.value)">
                </div>
            </div>
        </header>

        <main class="main-view">
            <div class="welcome-text" id="splash-text">LOADING...</div>
            <div class="search-bar" id="glow-bar">
                <input type="text" class="search-input" placeholder="Search Titan OS..." id="url-box" onkeydown="if(event.key==='Enter')sys_launch(this.value)">
            </div>
            <div class="links-bar" id="links-container"></div>
        </main>

        <footer class="bottom-dock">
            <div class="dock-container">
                <div class="dock-icon" onclick="sys_launch('https://google.com')">WEB</div>
                <div class="dock-icon" onclick="sys_launch('https://youtube.com')">VIDEO</div>
                <div class="dock-icon" onclick="sys_launch('https://now.gg')">GAMES</div>
            </div>
        </footer>
    </div>

    <div id="miku-root"></div>

    <script>
        // --- 1. SYSTEM STATE ---
        let cursorOn = true;
        let snowOn = true;

        function setWallpaper(url) { document.getElementById('mainBody').style.backgroundImage = `url('${url}')`; }
        function setThemeColor(hex) {
            document.documentElement.style.setProperty('--miku-cyan', hex);
            document.documentElement.style.setProperty('--border-glass', hex + '80');
        }
        function toggleSnow() {
            snowOn = !snowOn;
            document.getElementById('snowCanvas').style.display = snowOn ? 'block' : 'none';
            document.getElementById('snowToggle').innerText = snowOn ? "ON" : "OFF";
        }

        // --- 2. MIKU CURSOR ---
        const ASSETS = {
            idle: "https://cdn.discordapp.com/attachments/1444592922447057040/1479376567242330163/Screenshot_20260306-010851.Photos.png?ex=69abd04b&is=69aa7ecb&hm=d9ad588ac9f7b1bcaeb6d7906ef3caf0322c694b945b5c2f2ece4b5e18f9af14&",
            click: "https://cdn.discordapp.com/attachments/1444592922447057040/1479376566839410859/Screenshot_20260306-011055.Photos.png?ex=69abd04b&is=69aa7ecb&hm=bc9b954a686baf68327d99f4a796753c77387c5fd842ee401b331b0ab8ebfd95&"
        };
        const mRoot = document.getElementById('miku-root');
        const miku = document.createElement('img');
        miku.src = ASSETS.idle;
        miku.style.cssText = `position: fixed; width: 80px; pointer-events: none; z-index: 999999; transform: translate3d(-100px, -100px, 0); mix-blend-mode: multiply;`;
        mRoot.appendChild(miku);

        window.addEventListener('mousemove', e => {
            miku.style.transform = `translate3d(${e.clientX + 5}px, ${e.clientY + 5}px, 0)`;
            const rect = document.getElementById('glow-bar').getBoundingClientRect();
            document.getElementById('glow-bar').style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            document.getElementById('glow-bar').style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        window.addEventListener('mousedown', () => { if(cursorOn) miku.src = ASSETS.click; });
        window.addEventListener('mouseup', () => { if(cursorOn) miku.src = ASSETS.idle; });
        function toggleCursor() {
            cursorOn = !cursorOn;
            miku.style.display = cursorOn ? 'block' : 'none';
            document.body.classList.toggle('miku-cursor-active', cursorOn);
            document.getElementById('cursorToggle').innerText = cursorOn ? "ON" : "OFF";
        }

        // --- 3. LINKS SYSTEM ---
        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = `
                <div class="link-item" onclick="sys_launch('https://youtube.com')"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64"> YouTube</div>
                <div class="link-item" onclick="sys_launch('https://tiktok.com')"><img src="https://www.google.com/s2/favicons?domain=tiktok.com&sz=64"> TikTok</div>
                <div class="link-item" onclick="sys_launch('https://hianime.to')"><img src="https://www.google.com/s2/favicons?domain=hianime.to&sz=64"> HiAnime</div>
                <div class="link-item" onclick="sys_launch('https://sflix.to')"><img src="https://www.google.com/s2/favicons?domain=sflix.to&sz=64"> SFlix</div>
            `;
            const saved = JSON.parse(localStorage.getItem('os_links') || '[]');
            saved.forEach(link => {
                container.innerHTML += `<div class="link-item" onclick="sys_launch('${link.url}')"><img src="https://www.google.com/s2/favicons?domain=${link.url}&sz=64"> ${link.name}</div>`;
            });
            container.innerHTML += `<div class="link-item" style="border:2px dashed var(--miku-cyan); color:var(--miku-cyan);" onclick="addNewLink()">+ ADD</div>`;
        }

        function addNewLink() {
            const n = prompt("Website Name:"), u = prompt("URL:");
            if(n && u) {
                let list = JSON.parse(localStorage.getItem('os_links') || '[]');
                list.push({name: n, url: u.includes('://') ? u : 'https://' + u});
                localStorage.setItem('os_links', JSON.stringify(list));
                renderLinks();
            }
        }
        renderLinks();

        // --- 4. UI ANIMATION & SNOW ---
        function toggleMenu(id) { 
            const menu = document.getElementById(id);
            const isActive = menu.classList.contains('active');
            document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('active'));
            if(!isActive) menu.classList.add('active');
        }

        const msgs = ["MIKU", "TITAN OS", "CYBER-POP", "HELLO"];
        document.getElementById('splash-text').innerText = msgs[Math.floor(Math.random()*msgs.length)];
        function sys_launch(u) { window.open(u.startsWith('http')?u:'https://'+u, '_blank'); }

        const canvas = document.getElementById('snowCanvas'); const ctx = canvas.getContext('2d');
        const img = new Image(); img.src = "https://cdn.discordapp.com/attachments/1444592922447057040/1479367313026191401/Screenshot_20260306-003642.Chrome.png?ex=69abc7ac&is=69aa762c&hm=66b2ad1775d64dcc27d2fb69cfb24a4faa73d4cdd0d2797e989fe71d53849d64&";
        let p = [];
        function res() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = res; res();
        for(let i=0; i<45; i++) p.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*20+15, sp:Math.random()*2+1, a:Math.random()*360});
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if(snowOn) {
                p.forEach(i => { i.y += i.sp; i.a += 1; if(i.y > canvas.height) i.y = -20; ctx.save(); ctx.translate(i.x, i.y); ctx.rotate(i.a*Math.PI/180); ctx.drawImage(img, -i.s/2, -i.s/2, i.s, i.s); ctx.restore(); });
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
