<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Drive</title>
    <link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --miku-cyan: #39C5BB;
            --dark-glass: rgba(13, 25, 38, 0.75);
            --border-glass: rgba(57, 197, 187, 0.4);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Nunito', sans-serif; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: linear-gradient(180deg, #4A90E2 0%, #87CEEB 50%, #B0E0E6 100%);
            background-size: cover;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            touch-action: none;
        }

        /* --- THE ONLY SECTION CHANGED --- */
        #snow-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        .falling-item {
            position: absolute; top: -50px;
            width: 25px; height: auto;
            /* Target light blue background and force it to pure white */
            filter: brightness(2.2) contrast(1.2) grayscale(1);
            /* Multiply mode makes white backgrounds 100% transparent */
            mix-blend-mode: multiply; 
            animation: fall linear infinite;
        }
        /* --- END OF CHANGES --- */

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .top-nav { position: relative; z-index: 10; display: flex; justify-content: space-between; padding: 30px 20px; }
        .nav-pill { background: var(--dark-glass); backdrop-filter: blur(15px); border: 1px solid var(--border-glass); border-radius: 30px; padding: 12px 20px; color: white; font-weight: 700; }
        
        .center-stage { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 0 20px; }
        .search-container { width: 100%; max-width: 500px; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px); border: 2px solid var(--border-glass); border-radius: 60px; padding: 15px 25px; display: flex; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .search-input { background: transparent; border: none; outline: none; color: white; font-size: 1.1rem; width: 100%; font-weight: 600; text-align: center; }

        .dock { width: 100%; display: flex; justify-content: center; padding-bottom: 30px; z-index: 10; }
        .dock-bar { background: var(--dark-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 30px; padding: 15px 30px; display: flex; gap: 25px; }
        .dock-item { display: flex; flex-direction: column; align-items: center; color: var(--miku-cyan); font-weight: 800; font-size: 0.75rem; }

        #miku-cursor {
            position: fixed;
            width: 75px;
            height: auto;
            pointer-events: none;
            z-index: 2147483647; 
            display: none;
            mix-blend-mode: multiply;
            filter: contrast(1.1) brightness(1.1);
        }
    </style>
</head>
<body>

    <div id="snow-layer"></div>

    <nav class="top-nav">
        <div class="nav-pill">≡ GAMES • UPDATES</div>
        <div class="nav-pill" onclick="panic()">⚙ SETTINGS</div>
    </nav>

    <main class="center-stage">
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search or Enter URL..." id="url-input">
        </div>
    </main>

    <footer class="dock">
        <div class="dock-bar">
            <div class="dock-item" onclick="launch('https://google.com')">🌐 WEB</div>
            <div class="dock-item" onclick="launch('https://youtube.com')">▶ VIDEO</div>
            <div class="dock-item" onclick="launch('https://now.gg')">🎮 GAMES</div>
            <div class="dock-item" onclick="launch('https://discord.com')">💬 CHAT</div>
        </div>
    </footer>

    <img id="miku-cursor" src="" alt="cursor">

    <script>
        const snowImg = "https://cdn.discordapp.com/attachments/1444592922447057040/1479367313026191401/Screenshot_20260306-003642.Chrome.png?ex=69abc7ac&is=69aa762c&hm=66b2ad1775d64dcc27d2fb69cfb24a4faa73d4cdd0d2797e989fe71d53849d64&";
        const mikuIdle = "https://cdn.discordapp.com/attachments/1444592922447057040/1479376567242330163/Screenshot_20260306-010851.Photos.png?ex=69abd04b&is=69aa7ecb&hm=d9ad588ac9f7b1bcaeb6d7906ef3caf0322c694b945b5c2f2ece4b5e18f9af14&";
        const mikuClick = "https://cdn.discordapp.com/attachments/1444592922447057040/1479376566839410859/Screenshot_20260306-011055.Photos.png?ex=69abd04b&is=69aa7ecb&hm=bc9b954a686baf68327d99f4a796753c77387c5fd842ee401b331b0ab8ebfd95&";

        const snowLayer = document.getElementById('snow-layer');
        function spawn() {
            const s = document.createElement('img');
            s.src = snowImg; s.className = 'falling-item';
            s.style.left = Math.random() * 100 + 'vw';
            const d = Math.random() * 4 + 6;
            s.style.animationDuration = d + 's';
            s.style.width = (Math.random() * 15 + 15) + 'px'; // Adjusted size
            snowLayer.appendChild(s);
            setTimeout(() => s.remove(), d * 1000);
        }
        setInterval(spawn, 500);

        const miku = document.getElementById('miku-cursor');
        miku.src = mikuIdle;

        function updatePos(e) {
            const touch = e.touches[0];
            miku.style.left = (touch.clientX - 37) + 'px';
            miku.style.top = (touch.clientY - 37) + 'px';
        }

        window.addEventListener('touchstart', (e) => {
            miku.style.display = 'block';
            miku.src = mikuClick;
            updatePos(e);
        });

        window.addEventListener('touchmove', (e) => {
            updatePos(e);
        });

        window.addEventListener('touchend', () => {
            miku.src = mikuIdle;
        });

        function launch(url) {
            let val = document.getElementById('url-input').value || url;
            if (!val.startsWith('http')) val = 'https://' + val;
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.title = "Google Drive";
                const iframe = win.document.createElement('iframe');
                iframe.style = "position:fixed; top:0; left:0; width:100%; height:100%; border:none; margin:0;";
                iframe.src = val;
                win.document.body.appendChild(iframe);
            }
        }

        document.getElementById('url-input').onkeydown = (e) => { if(e.key === 'Enter') launch(''); };
        function panic() { window.location.replace("https://classroom.google.com"); }
    </script>
</body>
</html>
