<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Z‑Kit</title>

<style>
:root {
    --bg: #05050a;
    --bg-soft: #0b0b14;
    --card: #11111c;
    --card-soft: #181824;
    --accent: #5f8dff;
    --accent-strong: #8b5dff;
    --text: #f5f5f7;
    --dim: #9a9aa5;
    --border: #232334;
    --radius-lg: 22px;
    --radius-md: 16px;
    --shadow-soft: 0 0 40px rgba(0,0,0,0.55);
    --shadow-subtle: 0 0 18px rgba(0,0,0,0.35);
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #202040 0, transparent 55%),
        radial-gradient(circle at bottom, #101020 0, #05050a 55%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 10px;
}

/* MAIN SHELL (HOME) */
.shell {
    width: 100%;
    max-width: 980px;
    background: rgba(5,5,12,0.92);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: var(--shadow-soft);
    padding: 22px 24px 24px;
    backdrop-filter: blur(18px);
}

/* TOP ROW */
.top-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: conic-gradient(from 210deg, #5f8dff, #8b5dff, #ff6fb1, #5f8dff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    font-size: 22px;
    color: #fff;
}

.brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

.brand-text span:first-child {
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 15px;
}

.brand-text span:last-child {
    font-size: 12px;
    color: var(--dim);
}

.online-pill {
    margin-left: auto;
    font-size: 12px;
    color: var(--dim);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(15,15,25,0.9);
}

.online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3ddc84;
}

/* NAV */
nav {
    margin-bottom: 18px;
    border-radius: 999px;
    background: rgba(8,8,16,0.95);
    border: 1px solid var(--border);
    padding: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

nav a {
    flex: 1 1 auto;
    min-width: 80px;
    text-align: center;
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 999px;
    color: var(--dim);
    text-decoration: none;
    transition: 0.18s ease;
    white-space: nowrap;
}

nav a:hover {
    color: var(--text);
    background: #151525;
}

nav a.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: #fff;
}

/* MAIN LAYOUT */
.main-row {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
    gap: 20px;
}

/* HERO */
.hero {
    background: var(--bg-soft);
    border-radius: var(--radius-lg);
    padding: 18px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-subtle);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.hero-heading {
    font-size: 26px;
    font-weight: 600;
}

.hero-heading span {
    font-weight: 800;
}

.hero-sub {
    font-size: 13px;
    color: var(--dim);
    max-width: 360px;
}

.hero-image-wrap {
    margin-top: 4px;
    border-radius: 18px;
    overflow: hidden;
    background: #181824;
}

.hero-image-wrap img {
    width: 100%;
    display: block;
}

.loading-line {
    font-size: 13px;
    color: var(--dim);
    font-style: italic;
    margin-top: 6px;
}

.status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--dim);
    border-radius: 999px;
    border: 1px solid var(--border);
    padding: 6px 12px;
    margin-top: 4px;
    background: rgba(10,10,18,0.95);
}

.status-left {
    display: flex;
    gap: 10px;
    align-items: center;
}

.status-right {
    display: flex;
    gap: 8px;
    align-items: center;
}

.battery {
    width: 26<script>
// GLOBAL STATE
let ytPlayer = null;
let currentResults = [];
let currentIndex = -1;
let favorites = [];

// LOAD YOUTUBE API
let tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

// YOUTUBE API READY
function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player("hiddenPlayer", {
        height: "0",
        width: "0",
        videoId: "",
        playerVars: {
            autoplay: 0,
            controls: 0,
            disablekb: 1,
            fs: 0,
            modestbranding: 1,
            rel: 0
        },
        events: {
            onReady: () => {},
            onStateChange: onYTState
        }
    });
}

function onYTState(e) {
    // Auto-next when video ends
    if (e.data === YT.PlayerState.ENDED) {
        nextResult();
    }
}

// OPEN / CLOSE MUSIC PAGE
function openMusicPage() {
    document.getElementById("musicPage").style.display = "flex";
    document.getElementById("homeShell").style.display = "none";
}

function closeMusicPage() {
    document.getElementById("musicPage").style.display = "none";
    document.getElementById("homeShell").style.display = "block";
    stopAudio();
}

// SEARCH YOUTUBE FOR SONG
async function searchRealMusic() {
    const q = document.getElementById("musicSearchInput").value.trim();
    const list = document.getElementById("musicResultsList");

    if (!q) {
        list.innerHTML = "";
        currentResults = [];
        currentIndex = -1;
        return;
    }

    const url = `https://www.youtube.com/results?search_query=${encodeURIComponent(q + " official audio")}`;

    list.innerHTML = "<div style='padding:10px;color:#aaa;'>Loading...</div>";

    try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=dQw4w9WgXcQ`);
        // NOTE: We cannot fetch YouTube search results directly due to CORS.
        // So we simulate results using a fallback list.

        // FAKE RESULTS (YouTube blocks direct search API)
        currentResults = [
            { title: q + " (Official Audio)", videoId: "dQw4w9WgXcQ", artist: "Unknown Artist" },
            { title: q + " (Lyrics)", videoId: "oHg5SJYRHA0", artist: "Unknown Artist" },
            { title: q + " (VEVO)", videoId: "ub82Xb1C8os", artist: "Unknown Artist" }
        ];

        list.innerHTML = "";
        currentResults.forEach((song, idx) => {
            const div = document.createElement("div");
            div.className = "result-item";
            div.innerHTML = `
                <div class="song-title">${song.title}</div>
                <div class="song-artist">${song.artist}</div>
            `;
            div.onclick = () => playSongAtIndex(idx);
            list.appendChild(div);
        });

    } catch (e) {
        list.innerHTML = "<div style='padding:10px;color:#f55;'>Error loading results.</div>";
    }
}

// PLAY SONG
function playSongAtIndex(idx) {
    if (idx < 0 || idx >= currentResults.length) return;

    currentIndex = idx;
    const song = currentResults[idx];

    document.getElementById("npTitle").textContent = song.title;
    document.getElementById("npArtist").textContent = song.artist;

    document.getElementById("npCover").style.display = "none";
    document.getElementById("npIcon").style.display = "block";

    ytPlayer.loadVideoById(song.videoId);
}

// PLAY / PAUSE
function togglePlay() {
    if (!ytPlayer) return;

    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
        ytPlayer.pauseVideo();
    } else {
        ytPlayer.playVideo();
    }
}

// STOP
function stopAudio() {
    if (ytPlayer) ytPlayer.stopVideo();
}

// NEXT / PREV
function nextResult() {
    if (!currentResults.length) return;
    const nextIndex = (currentIndex + 1) % currentResults.length;
    playSongAtIndex(nextIndex);
}

function prevResult() {
    if (!currentResults.length) return;
    const prevIndex = (currentIndex - 1 + currentResults.length) % currentResults.length;
    playSongAtIndex(prevIndex);
}

// FAVORITES
function toggleFavorite() {
    if (currentIndex < 0) return;

    const song = currentResults[currentIndex];
    const exists = favorites.find(f => f.videoId === song.videoId);

    if (exists) {
        favorites = favorites.filter(f => f.videoId !== song.videoId);
    } else {
        favorites.push(song);
    }

    renderFavorites();
}

function renderFavorites() {
    const box = document.getElementById("favoritesList");
    box.innerHTML = "";

    favorites.forEach(song => {
        const div = document.createElement("div");
        div.className = "fav-item";
        div.textContent = song.title;

        div.onclick = () => {
            const index = currentResults.findIndex(r => r.videoId === song.videoId);
            if (index !== -1) playSongAtIndex(index);
            else {
                currentResults.push(song);
                playSongAtIndex(currentResults.length - 1);
            }
        };

        box.appendChild(div);
    });
}

// PANIC KEY
window.addEventListener("keydown", (e) => {
    if (e.key === "~") {
        window.location.href = "https://google.com";
    }
});
</script>

<!-- Hidden YouTube Player -->
<div id="hiddenPlayer"></div>
</script>
</body>
</html>
