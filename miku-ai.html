<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miku AI Terminal</title>
    <style>
        body { background: #000; color: #00ffff; font-family: monospace; margin: 0; padding: 20px; }
        
        /* THE MAIN BOX */
        .terminal { 
            border: 3px solid #00ffff; 
            background: rgba(0, 20, 20, 0.9); 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 0 30px #00ffff;
            height: 70vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #chat-logs { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; font-size: 14px; }

        /* THE INPUT AREA */
        .input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; background: #111; border: 1px solid #00ffff; color: #fff; padding: 12px; border-radius: 5px; }
        button { background: #00ffff; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }

        /* THE FLOATING BUBBLE (BOTTOM RIGHT) */
        #miku-bubble { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            z-index: 10000; /* This makes sure she is ON TOP of everything */
            cursor: pointer;
            transition: 0.3s;
        }
        #miku-bubble img { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; 
            border: 4px solid #00ffff; 
            box-shadow: 0 0 25px #00ffff; 
        }
    </style>
</head>
<body>

<div class="terminal">
    <center><img id="miku-face" src="https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." style="width:120px; border-radius:50%; border:2px solid #00ffff;"></center>
    <div id="chat-logs"><div>[SYSTEM]: Titan OS Intelligence Active...</div></div>
    
    <div class="input-area">
        <input type="text" id="user-msg" placeholder="Command Miku...">
        <button onclick="talk()">SEND</button>
    </div>
</div>

<div id="miku-bubble" onclick="document.getElementById('user-msg').focus();">
    <img src="https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." alt="Miku Bubble">
</div>

<script>
    const face = document.getElementById('miku-face');
    const logs = document.getElementById('chat-logs');
    const input = document.getElementById('user-msg');

    function talk() {
        const text = input.value.toLowerCase();
        if(!text) return;

        logs.innerHTML += `<div style="color:#fff; margin-top:10px;">> ${input.value}</div>`;
        
        setTimeout(() => {
            let reply = "Opening archives for: " + text;
            if(text.includes("roblox")) reply = "R6 Scripting protocols ready for Roblox!";
            else if(text.includes("math")) reply = "C = 2 * PI * R. I'm ready to calculate!";
            
            // THE KNOW EVERYTHING ENGINE
            if(!text.includes("roblox") && !text.includes("math")) {
                window.open("https://duckduckgo.com/?q=" + encodeURIComponent(text), "_blank");
            }

            logs.innerHTML += `<div style="margin-top:5px; color:#00ffff;">MIKU: ${reply}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }, 600);
        
        input.value = "";
    }
</script>

</body>
</html>
