<!DOCTYPE html>
<html>
<head>
    <title>Miku AI Core</title>
    <style>
        body { background: #000; color: #00ffff; font-family: monospace; padding: 20px; }
        #chat-logs { height: 70vh; overflow-y: auto; border: 1px solid #00ffff; padding: 10px; margin-bottom: 10px; }
        .miku-face { width: 100px; border-radius: 50%; border: 2px solid #00ffff; display: block; margin: 0 auto 10px; }
    </style>
</head>
<body>
    <img src="miku-avatar.png" class="miku-face" onerror="this.src='https://via.placeholder.com/100/00ffff/000000?text=MIKU'">
    <div id="chat-logs"><div>[SYSTEM]: Intelligence Core Online.</div></div>
    <input type="text" id="user-msg" placeholder="Ask Miku..." style="width: 80%; padding: 10px; background: #111; border: 1px solid #00ffff; color: #fff;">
    <button onclick="talk()" style="padding: 10px; background: #00ffff; cursor: pointer;">SEND</button>

    <script>
        async function talk() {
            let input = document.getElementById('user-msg');
            let logs = document.getElementById('chat-logs');
            let query = input.value.trim();
            if(!query) return;

            logs.innerHTML += `<div style="color:#fff;">> ${query}</div>`;
            
            // THE "KNOW EVERYTHING" BRAIN
            try {
                let res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}?origin=*`);
                let data = await res.json();
                let answer = data.extract ? data.extract : "Searching deeper...";
                
                if(!data.extract) window.open("https://duckduckgo.com/?q=" + query, "_blank");
                
                logs.innerHTML += `<div style="color:#00ffff;">MIKU: ${answer}</div>`;
            } catch(e) {
                window.open("https://duckduckgo.com/?q=" + query, "_blank");
            }
            input.value = "";
            logs.scrollTop = logs.scrollHeight;
        }
    </script>
</body>
</html>
