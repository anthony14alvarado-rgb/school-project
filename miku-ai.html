<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan OS | Miku AI Terminal</title>
    <style>
        :root {
            --miku-cyan: #33ccff;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background: #0b0f19;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- THE CHAT INTERFACE --- */
        .ai-terminal {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--miku-cyan);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 0 30px rgba(51, 204, 255, 0.2);
        }

        /* --- MIKU AVATAR --- */
        .miku-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(51, 204, 255, 0.3);
        }

        #miku-face {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--miku-cyan);
            object-fit: cover;
            transition: 0.3s ease-in-out;
        }

        /* --- CHAT LOGS --- */
        #chat-logs {
            flex-grow: 1;
            overflow-y: auto;
            margin: 20px 0;
            padding-right: 10px;
        }

        .bubble {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            max-width: 70%;
            line-height: 1.4;
        }

        .miku-reply {
            background: rgba(51, 204, 255, 0.15);
            color: var(--miku-cyan);
            align-self: flex-start;
            border-left: 4px solid var(--miku-cyan);
        }

        .user-reply {
            background: rgba(255, 255, 255, 0.1);
            margin-left: auto;
            text-align: right;
        }

        /* --- INPUT --- */
        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            background: transparent;
            border: 1px solid var(--miku-cyan);
            color: white;
            padding: 12px;
            border-radius: 5px;
            outline: none;
        }

        button {
            background: var(--miku-cyan);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ai-terminal">
        <div class="miku-header">
            <img id="miku-face" src="https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." alt="Miku">
            <div>
                <h2 style="margin: 0; color: var(--miku-cyan);">Miku AI Core</h2>
                <span id="status-text" style="font-size: 12px; color: #888;">STATUS: ONLINE</span>
            </div>
        </div>

        <div id="chat-logs" style="display: flex; flex-direction: column;">
            <div class="bubble miku-reply">Hello! I'm synchronized with Titan OS. What's on your mind?</div>
        </div>

        <div class="input-box">
            <input type="text" id="user-msg" placeholder="Type a command...">
            <button onclick="talk()">SEND</button>
        </div>
    </div>

    <script>
        const FACES = {
            smiling: "https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?ex=69b0f4ac&is=69afa32c&hm=27b57a62482364599007a95cc21027f6126235201a9825105aa172bd315b95c4&",
            thinking: "https://cdn.discordapp.com/attachments/1444592922447057040/1480790067743162409/Screenshot_20260309-234509.Google.png?ex=69b0f4b7&is=69afa337&hm=e0439e45b29c1eeaac09fcab84aec3b714ff15ff953e68eec1a8b6b3269389ad&",
            sleeping: "https://cdn.discordapp.com/attachments/1444592922447057040/1480790067327795300/Screenshot_20260309-234840.Chrome.png?ex=69b0f4b7&is=69afa337&hm=cc70cc2e9454a127bc95d8e445f92bb27b490b5f67fcc3a801f3c874674bad3e&",
            weird: "https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." // Shocking face
        };

        const faceImg = document.getElementById('miku-face');
        const logs = document.getElementById('chat-logs');
        let afk;

        function talk() {
            const input = document.getElementById('user-msg');
            if (input.value === "") return;

            // 1. User Message
            logs.innerHTML += `<div class="bubble user-reply">${input.value}</div>`;
            
            // 2. Miku Starts Thinking
            faceImg.src = FACES.thinking;
            document.getElementById('status-text').innerText = "STATUS: PROCESSING...";

            // 3. Response
            setTimeout(() => {
                logs.innerHTML += `<div class="bubble miku-reply">Titan OS is running smoothly! I've updated the logs.</div>`;
                faceImg.src = FACES.smiling;
                document.getElementById('status-text').innerText = "STATUS: ONLINE";
                logs.scrollTop = logs.scrollHeight;
            }, 1000);

            input.value = "";
            resetAFK();
        }

        // Sleeping Logic
        function resetAFK() {
            clearTimeout(afk);
            if (faceImg.src === FACES.sleeping) faceImg.src = FACES.smiling;
            afk = setTimeout(() => {
                faceImg.src = FACES.sleeping;
                document.getElementById('status-text').innerText = "STATUS: IDLE";
            }, 30000); // 30 seconds to sleep
        }

        window.addEventListener('mousemove', resetAFK);
        resetAFK();
    </script>
</body>
</html>
