<div id="miku-side-panel" style="position: fixed; top: 0; right: -400px; width: 350px; height: 100vh; background: rgba(10, 15, 25, 0.95); backdrop-filter: blur(15px); border-left: 2px solid #33ccff; transition: 0.5s; z-index: 10000; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.5);">
    
    <button onclick="toggleMiku()" style="background: none; border: 1px solid #33ccff; color: #33ccff; cursor: pointer; padding: 5px 10px; margin-bottom: 10px;">CLOSE [X]</button>

    <div style="text-align: center;">
        <img id="miku-panel-face" src="https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." style="width: 120px; border-radius: 50%; border: 2px solid #33ccff;">
        <h3 style="color: #33ccff; font-family: sans-serif; margin: 10px 0;">MIKU CORE</h3>
    </div>

    <div id="miku-chat-box" style="height: 60%; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; font-family: monospace; font-size: 13px; color: #33ccff; margin-bottom: 15px;">
        <div>[SYSTEM]: Miku AI Connected to Titan OS.</div>
    </div>

    <input type="text" id="miku-msg" placeholder="Command Miku..." style="width: 80%; background: none; border: 1px solid #33ccff; color: white; padding: 10px; border-radius: 5px; outline: none;">
    <button onclick="mikuTalk()" style="background: #33ccff; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px;">></button>
</div>

<div id="miku-trigger" onclick="toggleMiku()" style="position: fixed; bottom: 20px; right: 20px; cursor: pointer; z-index: 9999;">
    <img src="https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." style="width: 60px; height: 60px; border-radius: 50%; border: 2px solid #33ccff; box-shadow: 0 0 15px #33ccff;">
    <div style="color: #33ccff; font-size: 10px; text-align: center; font-family: sans-serif; font-weight: bold;">OPEN AI</div>
</div>

<script>
    let panelOpen = false;
    const mikuFace = document.getElementById('miku-panel-face');
    const faces = {
        happy: "https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?...",
        thinking: "https://cdn.discordapp.com/attachments/1444592922447057040/1480790067743162409/Screenshot_20260309-234509.Google.png?..."
    };

    function toggleMiku() {
        const panel = document.getElementById('miku-side-panel');
        panelOpen = !panelOpen;
        panel.style.right = panelOpen ? "0px" : "-400px";
    }

    function mikuTalk() {
        const input = document.getElementById('miku-msg');
        const box = document.getElementById('miku-chat-box');
        if(input.value === "") return;

        box.innerHTML += `<div style="color:white; margin-top:10px;">YOU: ${input.value}</div>`;
        mikuFace.src = faces.thinking;

        setTimeout(() => {
            box.innerHTML += `<div style="margin-top:5px;">MIKU: Optimizing Titan OS performance...</div>`;
            mikuFace.src = faces.happy;
            box.scrollTop = box.scrollHeight;
        }, 1000);

        input.value = "";
    }
</script>
