<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000; color: #00ffff; font-family: monospace; margin: 0; }
        
        /* THE MAIN BOX */
        .terminal { 
            border: 2px solid #00ffff; 
            background: rgba(0, 10, 10, 0.9); 
            margin: 10px;
            padding: 15px; 
            border-radius: 10px; 
            box-shadow: 0 0 20px #00ffff;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }

        #chat-logs { flex-grow: 1; overflow-y: auto; font-size: 14px; padding: 10px; }

        /* INPUT BOX */
        .input-area { display: flex; gap: 5px; padding: 10px; background: #111; border-top: 1px solid #00ffff; }
        input { flex-grow: 1; background: #000; border: 1px solid #00ffff; color: #fff; padding: 10px; outline: none; }
        button { background: #00ffff; border: none; padding: 10px; font-weight: bold; cursor: pointer; }

        /* THE FLOATING BUBBLE (BOTTOM RIGHT) */
        #miku-bubble { 
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            width: 70px; 
            height: 70px;
            z-index: 10000;
            cursor: pointer;
            border-radius: 50%;
            border: 3px solid #00ffff;
            background: #00ffff; /* Backup color if image fails */
            box-shadow: 0 0 20px #00ffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #miku-bubble img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="terminal">
    <div id="chat-logs"><div>[SYSTEM]: Titan OS v1.0 - Intelligence Core Active</div></div>
    
    <div class="input-area">
        <input type="text" id="user-msg" placeholder="Type to Miku...">
        <button onclick="talk()">SEND</button>
    </div>
</div>

<div id="miku-bubble" onclick="document.getElementById('user-msg').focus();">
    <img src="https://cdn.discordapp.com/attachments/1444592922447057040/1480790018594443447/image.png?..." alt="Miku">
</div>

<script>
    const logs = document.getElementById('chat-logs');
    const input = document.getElementById('user-msg');

    function talk() {
        const text = input.value.trim().toLowerCase();
        if(!text) return;

        logs.innerHTML += `<div style="color:#fff; margin-top:8px;">> ${input.value}</div>`;
        
        setTimeout(() => {
            let reply = "Opening records for: " + text;
            if(text.includes("roblox") || text.includes("r6")) reply = "R6 Scripting initialized. Checking Motor6D connections...";
            else if(text.includes("math")) reply = "C = 2 * π * r. How can I help with your geometry?";
            else {
                window.open("https://duckduckgo.com/?q=" + encodeURIComponent(text), "_blank");
            }

            logs.innerHTML += `<div style="margin-top:4px; color:#00ffff;">MIKU: ${reply}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }, 500);
        
        input.value = "";
    }
</script>

</body>
</html>
